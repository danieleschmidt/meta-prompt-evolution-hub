apiVersion: v1
kind: Service
metadata:
  name: progressive-quality-gates-service
  namespace: quality-gates
  labels:
    app: progressive-quality-gates
spec:
  selector:
    app: progressive-quality-gates
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP

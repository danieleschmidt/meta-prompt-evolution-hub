apiVersion: apps/v1
kind: Deployment
metadata:
  name: meta-prompt-evolution
  namespace: production
  labels:
    app: meta-prompt-evolution
    region: us-east-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meta-prompt-evolution
  template:
    metadata:
      labels:
        app: meta-prompt-evolution
        region: us-east-1
    spec:
      containers:
      - name: meta-prompt-evolution
        image: meta-prompt-evolution:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        env:
        - name: REGION
          value: "us-east-1"
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: meta-prompt-evolution-service
  namespace: production
spec:
  selector:
    app: meta-prompt-evolution
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meta-prompt-evolution-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meta-prompt-evolution
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meta-prompt-evolution-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: meta-prompt-evolution
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379

# Progressive Quality Gates - Docker Compose
version: '3.8'

services:
  progressive-quality-gates:
    build: .
    image: terragon/progressive-quality-gates:latest
    container_name: progressive-quality-gates
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ENABLE_MONITORING=true
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./results:/app/results
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import progressive_quality_gates_gen1; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quality-gates-network

  redis:
    image: redis:7-alpine
    container_name: quality-gates-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quality-gates-network

  prometheus:
    image: prom/prometheus:latest
    container_name: quality-gates-metrics
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - quality-gates-network

  grafana:
    image: grafana/grafana:latest
    container_name: quality-gates-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - quality-gates-network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  quality-gates-network:
    driver: bridge

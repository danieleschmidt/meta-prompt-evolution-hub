apiVersion: apps/v1
kind: Deployment
metadata:
  name: progressive-quality-gates
  namespace: production
  labels:
    app: progressive-quality-gates
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: progressive-quality-gates
  template:
    metadata:
      labels:
        app: progressive-quality-gates
    spec:
      containers:
      - name: progressive-quality-gates
        image: terragon/progressive-quality-gates:latest
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: progressive-quality-gates-service
  namespace: production
spec:
  selector:
    app: progressive-quality-gates
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
